# Build, test and publish KharchaLens to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Unit tests (parsing, categories, self-transfers, network lockdown)
        run: npm test

      - name: Lint (fails on any network API in app code)
        run: npm run lint

      - name: Build for https://<user>.github.io/<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check the privacy policy is baked into the page
        run: grep -q "connect-src 'none'" dist/index.html

      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
